<!DOCTYPE html>

<head>
    <title>Welcome - Login & Register</title>
    <script src="my-account.js" defer></script>
    <style>
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, hsl(211, 100%, 50%), hsl(211, 100%, 80%));
        }

        .center-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 250px;
            box-shadow: 0 2px 2px rgba(0, 0, 0, 0.511);
            background-color: white;

            border: 5px solid hsl(211, 100%, 34%);
            border-radius: 10px;
        }

        .container {
            display: flex;
            flex-direction: column;
            margin: 25px;
        }

        .interract-button {
            margin: 5px;
            padding: 10px;
            color: white;
            background-color: rgb(0, 136, 255);
            border: transparent;
            border-radius: 10px;
        }

        .interract-button:hover {
            background-color: rgb(0, 97, 183);
            cursor: pointer;
        }

        .interract-button.delete {
            background-color: rgb(255, 66, 66);
        }

        .interract-button.delete:hover {
            background-color: rgb(119, 0, 0);
        }

        .backdrop {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        
        .backdrop.hidden {
            display: none;
        }

        .popup-window {
            position: fixed;
            inset: 0;
            margin: auto;
            width: fit-content;
            height: fit-content;
            z-index: 20;

            display: flex;
            flex-direction: column;
            min-width: 150px;
            min-height: 100px;
            background-color: white;

            border: 5px solid hsl(211, 100%, 34%);
            border-radius: 10px;
            box-shadow: 0 2px 2px rgba(0, 0, 0, 0.511);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="center-box">
        <div id="backdrop" class="backdrop"></div>

        <div id="popup-window" class="popup-window">

            <h3 id="popup-window-header">empty</h3>

            <section id="popup-window-input-container">
                <input type="text" id="popup-window-input-1" class="hidden">
                <input type="text" id="popup-window-input-2" class="hidden">
            </section>
            
            <section id="popup-window-button-container">
                <button id="submit-button" class="interract-button">Submit</button>
                <button id="cancel-button" class="interract-button">Cancel</button>
            </section>

            <section id="popup-window-request-list">
                <ul id="request-list">
                </ul>
            </section>

            <p id="popup-window-error-message" style="color: red;"></p>
        </div>

        <h3 class="title">My Account</h3>
        <section id="main-container" class="container">
            <button id="change-name-button" class="interract-button">Change name</button>
            <button id="change-password-button" class="interract-button">Change password</button>
            <button id="share-requests-button" class="interract-button">Share requests</button>
            <button id="delete-button" class="interract-button">Delete account</button>
            <button id="back-button" class="interract-button">Back</button>
        </section>

    </div>
</body>
