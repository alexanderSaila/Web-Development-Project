<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <head>
        <title>Welcome - Login & Register</title>
        <link rel="stylesheet" href="login-registry-style.css">
    </head>

<body>
    <div class="center-box">
        <h3 class="title">LOGIN</h3>
        <section id="login-box" class="container">
            <form id="login-form" class="input-form">
                <label for="email" class="hidden">Email:</label>
                <input type="email" id="email" placeholder="email" class="input-field" required>
                <label for="password" class="hidden">Password:</label>
                <input type="password" id="password" placeholder="password" class="input-field" required>
                <button type="submit" class="submit-button">Submit</button>
                <button type="button" class="register-button" onclick="window.location.href='/register.html'">Register</button>
            </form>
        </section>
        <p id="error-message" style="color:red;" role="alert"></p>
    </div>

    <footer>
        <p>&copy; 2026 CO-Calendar. All rights reserved.</p>
        <p>This site uses a single cookie to keep you logged in. It is removed when you log out. No other cookies are used.</p>
    </footer>

    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                if(response.ok){
                    const user = await response.json();
                    console.log("User object:", user);
                    localStorage.setItem("firstName", user.firstName);

                    if(user.is_admin) {
                        window.location.href = "/admin";
                    } else {
                        window.location.href = "/Calendar.html";
                    } 
                } else { 
                    const errorData = await response.json();
                    document.getElementById("error-message").textContent = errorData.error || "Login failed. Please try again.";
                }
            } catch (error) {
                console.error("error logging in:", error);
                document.getElementById("error-message").textContent = "Network error. Please try again later.";
            }
        }); 
    </script>
</body>

</html>
