<!DOCTYPE html>

<head>
    <title>Welcome - Login & Register</title>
    <link rel="stylesheet" href="login-registry-style.css">
</head>

<body>
    <div class="center-box">
        <h3 class="title">LOGIN</h3>
        <section id="login-box" class="container">
            <form id="login-form" class="input-form">
                <input type="text" id="email" placeholder="email" class="input-field" required>
                <input type="password" id="password" placeholder="password" class="input-field" required>
                <button type="submit" class="submit-button">Submit</button>
            </form>
            <a id="register-user" href="/register.html">Register</a>
        </section>
        <p id = "error-message" class="error-message"></p>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                if(response.ok){
                    const user = await response.json();
                    
                    sessionStorage.setItem("loggedInUserId", user.id);

                    window.location.href = "/Calendar.html";
                }
            } catch (error) {
                console.error("error logging in:", error);
                document.getElementById("error-message").textContent = "Invalid email or password. Please try again.";
            }
        });
    </script>
</body>

</html>
