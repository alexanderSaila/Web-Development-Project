<!DOCTYPE html>
<html lang="en">

<head>
    <title>CO-CALENDAR</title>
    <link rel="stylesheet" href="calendar-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="ElementEditor.js" defer></script>
    <script src="Calendar.js" defer></script>
    <script src="UserNavigationHandler.js" defer></script>
    <script src="List.js" defer></script>
    <meta charset="UTF-8">
</head>

<body>
    <h1 class="section-title" id="greeting">CO-CALENDAR</h1>
    <section id="schedule-section" class="section">
        <div style="display: flex; justify-content: center; gap: 8px; align-items: center;">
            <button id="previous-month-button" class="interractive-button">&lt;</button>
            <h3 id="month-name" class="section-title">Schedule</h3>
            <button id="next-month-button" class="interractive-button">&gt;</button>


            <div class="options-field">
                <button id="account-button" class="interractive-button"><i class="fas fa-user"></i> My account</button>
                <button id="share-button" class="interractive-button"><i class="fas fa-share-nodes"></i> Share</button>
                <button onclick="logout()" class="interractive-button"><i class="fas fa-right-from-bracket"></i> Log
                    out</button>
            </div>


            <div id="share-window" class="share-window">
                <div class="share-content">
                    <h3 style="margin-top: 0px;">Share</h3>
                    <fieldset>
                        <legend>Share Type:</legend>
                        <input type="checkbox" id="share-tasks-checkbox" name="share-type" value="task" checked>
                        <label for="share-tasks-checkbox">Tasks</label>
                        <input type="checkbox" id="share-lists-checkbox" name="share-type" value="list">
                        <label for="share-lists-checkbox">Lists</label>
                    </fieldset>
                    <label for="share-email" class="hidden">Email:</label>
                    <input type="email" id="share-email" placeholder="Enter email address" required>
                    <button id="submit-share">Send</button>
                </div>
            </div>


            <div id="edit-task-window">
            </div>
        </div>
    </section>



    <section id="list-section" class="section">
        <h3 class="section-title">Lists</h3>


        <div class="list-container">
            <div id="empty-list" class="list-box">
                <button id="create-new-list-button" class="create-new-list-button">Create New List</button>
            </div>
        </div>


        <div id="edit-list-window">
            </div>
    </section>

    <footer>

    </footer>
</body>

</html>
