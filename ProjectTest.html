<html>
    <head>
        <title>Schedule Planner</title>
        <style>
            .hidden {
                display: none;
            }
            .section {
                border: 2px solid black;
                margin: 5px;
            }
            .section-title {
                text-align: center;
                margin-top: 10px;
                margin-left: 20px;
                margin-right: 20px;
            }
            .day-container{
                display: flex;
                flex-direction: row;
                justify-content: center;
            }
            .day-section {
                flex: 1;
                min-height: 100px;
                min-width: 100px;
                max-width: 200px;
                border: 1px solid black;
                background-color: #FFCCCC;
                margin: 2px;
            }
            .selected-day{
                background: #4AFF85;
            }
            .day-header{
                text-align: center;
                margin-top: 5px;
            }
            .day-task{
                margin: 5px;
            }
            .add-item-button{
                min-height: 20;
                min-width: 20;
                margin-left: 5px;
            }
            .navigate-week {
                min-width: 50px;
                max-height: 25px;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <h1 class="section-title">WELCOME</h1>
        <section id="schedule-section" class="section">
            <script src="Calendar.js" defer></script>
            <div style="display: flex; justify-content: center;">
                <button id="previous-month-button" class="navigate-week">&lt</button>
                <h3 id="month-name" class="section-title">Schedule</h3>
                <button id="next-month-button" class="navigate-week">&gt</button>
            </div>
        </section>
        <section id="list-section" class="section">
            <h3 class="section-title">Lists</h3>
        </section>
    </body>
    <footer>

    </footer>
</html>
